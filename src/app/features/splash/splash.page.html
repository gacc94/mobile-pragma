<ion-content [fullscreen]="true" class="splash-content">
    <div class="splash-wrapper" role="region" aria-label="Catbreeds Splash Screen">
        <header class="splash-header">
            <h1 class="splash-title">Catbreeds</h1>
        </header>

        <main class="splash-body">
            <div class="illustration-container">
                <img
                    src="assets/splash/cat-rafiki.svg"
                    alt="Catbreeds mascot illustration"
                    class="splash-illustration"
                    width="280"
                    height="280"
                    loading="eager"
                />
            </div>
        </main>

        <footer class="splash-footer">
            <ion-spinner
                name="crescent"
                color="primary"
                class="splash-spinner"
                aria-label="Loading cat breeds"
            ></ion-spinner>
        </footer>
    </div>
</ion-content>
