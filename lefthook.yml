# Lefthook Git hooks configuration
# Documentation: https://lefthook.dev

pre-commit:
    parallel: false
    commands:
        prettier:
            glob: '*.{js,ts,html,scss,json,md,yml,yaml}'
            run: npx prettier --write {staged_files}
            stage_fixed: true
        eslint:
            glob: '*.{js,ts,html}'
            run: npx eslint {staged_files}
            stage_fixed: true

commit-msg:
    commands:
        commitlint:
            run: npx --no -- commitlint --edit {1}
